name: Secrets inventory (read-only)

# Which integrations are actually configured in production?
#
# CLAUDE.md carries a hand-maintained list of "wired" vs "still needed", and
# hand-maintained lists drift — several entries in it turned out to be years
# stale. This asks Fly directly.
#
# SAFE BY CONSTRUCTION. `fly secrets list` prints NAME, DIGEST and CREATED AT.
# It cannot print a secret VALUE; there is no flag that would make it. The
# digest is a fingerprint, not a reversible encoding. Nothing here echoes an
# environment variable.
#
# Takes no inputs, so it cannot be turned into an arbitrary-command runner.

on:
  workflow_dispatch:

concurrency:
  group: secrets-inventory
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: What is set on the backend?
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${FLY_API_TOKEN:-}" ] || { echo "::error::FLY_API_TOKEN not set"; exit 1; }
          echo "=== tapeline-backend ==="
          flyctl secrets list -a tapeline-backend | tee /tmp/backend.txt

      - name: Which of the documented integrations are still missing?
        run: |
          set -uo pipefail
          # The names CLAUDE.md says are needed, grouped by what they unlock.
          cat > /tmp/expected.txt <<'EOF'
          MICROSOFT_CLIENT_ID|Microsoft OAuth (sign-in button)
          MICROSOFT_CLIENT_SECRET|Microsoft OAuth (sign-in button)
          ANTHROPIC_API_KEY|Inbox bot — LLM classifier
          INBOX_FOUNDER_TELEGRAM_CHAT_ID|Inbox bot — Tier 1 approval card
          RESEND_INBOUND_SECRET|Inbox bot — inbound email channel
          REDDIT_CLIENT_ID|Inbox bot — Reddit channel
          REDDIT_CLIENT_SECRET|Inbox bot — Reddit channel
          REDDIT_USERNAME|Inbox bot — Reddit channel
          REDDIT_PASSWORD|Inbox bot — Reddit channel
          META_CAPI_ACCESS_TOKEN|Meta ads — Conversions API
          EOF
          echo ""
          echo "=== documented-but-possibly-missing ==="
          missing=0
          while IFS='|' read -r name what; do
            [ -z "$name" ] && continue
            if grep -qE "^${name}[[:space:]]" /tmp/backend.txt; then
              printf "  SET      %-32s %s\n" "$name" "$what"
            else
              printf "  MISSING  %-32s %s\n" "$name" "$what"
              missing=$((missing + 1))
            fi
          done < /tmp/expected.txt
          echo ""
          echo "missing: $missing"
          echo ""
          echo "This job does not fail on a missing secret — several are"
          echo "deliberate (the inbox bot is shipped dormant). It reports only."

      - name: Can the founder Telegram chat id be discovered automatically?
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -uo pipefail
          # INBOX_FOUNDER_TELEGRAM_CHAT_ID is the one missing secret whose
          # VALUE the project can work out for itself — the bot token is
          # already set, and Telegram reports the chat id of anyone who has
          # messaged our bot. Prints the id and the exact `fly secrets set`
          # line; sets nothing.
          flyctl ssh console -a tapeline-backend             -C "python -m app.scripts.find_telegram_chat_id" ||             echo "(chat-id discovery unavailable — see the log above)"

