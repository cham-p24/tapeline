name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Copy-compliance gate. Blocks any change that reintroduces a performance
  # claim, an evaluative adjective on a security, manufactured urgency, or a
  # vs-SPY figure in a headline slot. See docs/COMPLIANCE_COPY_RULES.md.
  #
  # Runs first and depends on nothing: no npm install, no pip, no lockfile —
  # bare Node, so it stays fast and cannot be broken by an unrelated dependency
  # problem. A compliance gate that is flaky is a compliance gate that gets
  # marked non-required.
  copy-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Linter self-tests
        run: node --test scripts/lint-copy-compliance.test.mjs
      - name: Copy-compliance lint
        run: node scripts/lint-copy-compliance.mjs

      # Ad creative, stricter pass. Separate step because it is a DIFFERENT
      # ruleset, not a wider glob: `--ads` also bans "pick", "signal" and the
      # score-band names, which are legitimate product vocabulary everywhere
      # else (/daily-picks and /signals are real routes).
      #
      # This step exists because the one rule written for ad creative was
      # scoped to docs/ads/** while the step above passes no paths and the
      # include globs never covered docs/** — so from the day it was written
      # until 2026-09-05 it never executed in CI even once. A "pick" burned
      # into three ad images ran live for three days behind that gap.
      #
      # `|| true` on the glob: docs/ads/ may legitimately be empty.
      - name: Copy-compliance lint (ad creative)
        run: |
          shopt -s nullglob globstar
          files=(docs/ads/**/*.md docs/ads/**/*.txt docs/ads/**/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no ad creative files to lint"
          else
            node scripts/lint-copy-compliance.mjs --ads "${files[@]}"
          fi
        shell: bash

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app
      - name: Type check (mypy)
        run: mypy app --ignore-missing-imports --no-strict-optional
      - name: Tests (pytest)
        run: |
          cp ../.env.example ../.env
          pytest -x

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # Runs the vitest suite. This step was missing until 2026-07-18: the job
      # typechecked and built but never executed a single test, so the whole
      # frontend suite could go red without CI noticing.
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # End-to-end. Boots the real backend and the real production build, then
  # drives a browser — the layer that catches what neither unit suite can see:
  # a page that renders but whose form no longer submits, a price the card and
  # the comparison table disagree about, a nav link that 404s.
  #
  # Added 2026-08-28. Four specs had existed since June and CI never ran a
  # single one, so they had drifted two months out of date and 12 of 18 failed
  # against a perfectly healthy app — asserting a "Free" tier that had been
  # renamed, a headline that had been rewritten, and a signup CTA that had
  # gained a word. Unenforced tests do not stay true.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # SQLite, not Postgres: these specs exercise render + form behaviour, so
      # the DB only has to exist and have the right shape. create_all is used
      # rather than alembic so a pending migration can't fail the E2E gate for
      # a reason that has nothing to do with the UI.
      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./e2e.sqlite
          APP_ENV: development
        run: |
          python - <<'PY'
          import asyncio
          import app.models  # registers every mapper
          from app.db import Base, engine

          async def main() -> None:
              async with engine.begin() as conn:
                  await conn.run_sync(Base.metadata.create_all)

          asyncio.run(main())
          PY
          nohup python -m uvicorn app.main:app --port 8000 --log-level warning             > /tmp/e2e-backend.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/status > /dev/null; then
              echo "backend up"; exit 0
            fi
            sleep 2
          done
          echo "backend never came up"; cat /tmp/e2e-backend.log; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: E2E
        working-directory: frontend
        run: npm run e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            /tmp/e2e-backend.log
          retention-days: 7
