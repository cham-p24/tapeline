name: Neon autosuspend (disable scale-to-zero)

# One-click operator tool to set the Neon Postgres compute autosuspend WITHOUT
# anyone logging into the Neon dashboard or handling the Neon API key locally.
#
# WHY THIS EXISTS
#   The production frontend's /t/[symbol] pages 500 when the backend /api/ticker
#   fetch times out, and the deepest cause (documented in the backend fly.toml)
#   is Neon "scale to zero": after a deploy the DB compute is cold and the first
#   queries take seconds, tripping the frontend's 7s x2 timeout. Search Console
#   sees the result as sporadic "Server error (5xx)". Setting the compute's
#   suspend timeout to -1 (never suspend) removes the cold-start window entirely.
#   Uses the same NEON_API_KEY repo secret the project already stores, so the key
#   is never typed, pasted, logged, or seen by anyone.
#
# COST NOTE
#   -1 keeps the primary compute running continuously (it no longer scales to
#   zero on idle). In practice the 60s worker tick already keeps it warm almost
#   all the time, so the marginal cost is small — but it IS non-zero. Re-run with
#   a positive value (e.g. 604800 = 1 week) or 0 (Neon default ~300s) to revert.
#
# SCOPE
#   Targets ONLY the DEFAULT branch's read_write compute endpoint(s). Preview /
#   dev branch computes are left untouched so they still scale to zero.
#
# HOW TO RUN
#   Actions tab -> "Neon autosuspend (disable scale-to-zero)" -> Run workflow ->
#   type the confirm phrase. Or:
#     gh workflow run neon-autosuspend.yml -f confirm=disable-neon-autosuspend
#   If the key is project-scoped (can't list projects), the log prints the Neon
#   error body; re-run with -f project_id=<id> to operate on that project.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type exactly: disable-neon-autosuspend"
        required: true
        default: ""
      suspend_timeout_seconds:
        description: "-1 = never suspend (disable); 0 = Neon default (~300s); or a number of seconds"
        required: true
        default: "-1"
      project_id:
        description: "Optional: Neon project id to target. Blank = auto-pick the project whose name matches 'tapeline'."
        required: false
        default: ""

concurrency:
  group: neon-autosuspend
  cancel-in-progress: false

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: Gate on the confirm phrase
        if: ${{ inputs.confirm != 'disable-neon-autosuspend' }}
        run: |
          echo "::error title=Not confirmed::Type 'disable-neon-autosuspend' in the confirm box to run."
          exit 1

      - name: Set Neon compute autosuspend
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          TIMEOUT: ${{ inputs.suspend_timeout_seconds }}
          PROJECT_IN: ${{ inputs.project_id }}
        run: |
          set -uo pipefail
          key="$(printf '%s' "${NEON_API_KEY:-}" | tr -d '[:space:]')"
          if [ -z "$key" ]; then
            echo "::error title=No key::NEON_API_KEY secret is empty."; exit 1
          fi
          case "$TIMEOUT" in
            ''|*[!0-9-]*) echo "::error::suspend_timeout_seconds must be an integer (got '$TIMEOUT')"; exit 1;;
          esac
          API="https://console.neon.tech/api/v2"
          auth="Authorization: Bearer ${key}"

          # req METHOD URL [DATA]  ->  sets HTTP (status) + BODY. No -f (we want
          # the error body); -L follows any redirect. Response bodies never
          # contain the key, and Actions masks the secret regardless.
          req() {
            local m="$1" u="$2" d="${3:-}" t; t="$(mktemp)"
            if [ -n "$d" ]; then
              HTTP="$(curl -sS -L -o "$t" -w '%{http_code}' -X "$m" -H "$auth" -H "Content-Type: application/json" "$u" -d "$d")"
            else
              HTTP="$(curl -sS -L -o "$t" -w '%{http_code}' -X "$m" -H "$auth" "$u")"
            fi
            BODY="$(cat "$t")"; rm -f "$t"
          }

          # --- resolve the project id ---------------------------------------
          pid=""
          if [ -n "${PROJECT_IN}" ]; then
            pid="${PROJECT_IN}"
            echo "Using project_id from input: $pid"
          else
            req GET "$API/projects"
            echo "GET /projects -> HTTP $HTTP"
            if [ "$HTTP" = "200" ]; then
              echo "Projects visible to this key:"
              echo "$BODY" | jq -r '.projects[] | "  \(.id)\t\(.name)"'
              match="$(echo "$BODY" | jq -r '[.projects[] | select(.name|test("tapeline";"i")) | .id]')"
              n="$(echo "$match" | jq 'length')"
              if [ "$n" = "1" ]; then pid="$(echo "$match" | jq -r '.[0]')"
              elif [ "$(echo "$BODY" | jq '.projects | length')" = "1" ]; then pid="$(echo "$BODY" | jq -r '.projects[0].id')"
              else
                echo "::error title=Ambiguous::name-match=$n. Re-run with -f project_id=<id> from the list above."; exit 1
              fi
            else
              echo "Neon response body (no key in it):"
              echo "  $BODY"
              # A project-scoped key can't list projects but its error/JWT often
              # names the project. Try to surface any project-id-shaped token.
              guess="$(echo "$BODY" | grep -oiE '[a-z0-9]+-[a-z0-9]+-[0-9]{6,}' | head -1 || true)"
              [ -n "$guess" ] && echo "Possible project id in response: $guess"
              echo "::error title=Cannot list projects::Re-run with -f project_id=<id> (see body/guess above)."; exit 1
            fi
          fi
          echo "Target project: $pid"

          # --- default branch ------------------------------------------------
          req GET "$API/projects/$pid/branches"
          if [ "$HTTP" != "200" ]; then
            echo "GET branches -> HTTP $HTTP"; echo "  $BODY"
            echo "::error title=Branches failed::project id or key scope is wrong."; exit 1
          fi
          def_branch="$(echo "$BODY" | jq -r '(.branches[] | select(.default==true) | .id) // empty' | head -1)"
          [ -n "$def_branch" ] || { echo "::error::no default branch for $pid"; exit 1; }
          echo "Default branch: $def_branch"

          # --- patch the default branch's read_write endpoint(s) -------------
          req GET "$API/projects/$pid/endpoints"
          [ "$HTTP" = "200" ] || { echo "GET endpoints -> HTTP $HTTP"; echo "  $BODY"; exit 1; }
          echo "Endpoints on default branch:"
          echo "$BODY" | jq -r --arg b "$def_branch" '.endpoints[] | select(.branch_id==$b) | "  \(.id)\t\(.type)\tsuspend_now=\(.suspend_timeout_seconds)"'
          targets="$(echo "$BODY" | jq -r --arg b "$def_branch" '.endpoints[] | select(.branch_id==$b and .type=="read_write") | .id')"
          [ -n "$targets" ] || { echo "::error::no read_write endpoint on the default branch"; exit 1; }
          rc=0
          for eid in $targets; do
            echo "Patching $eid -> suspend_timeout_seconds=$TIMEOUT ..."
            req PATCH "$API/projects/$pid/endpoints/$eid" "{\"endpoint\":{\"suspend_timeout_seconds\": $TIMEOUT}}"
            if [ "$HTTP" != "200" ]; then echo "  PATCH -> HTTP $HTTP: $BODY"; rc=1; continue; fi
            now="$(echo "$BODY" | jq -r '.endpoint.suspend_timeout_seconds')"
            echo "  -> now suspend_timeout_seconds=$now"
            [ "$now" = "$TIMEOUT" ] || { echo "::error::verify mismatch on $eid (got $now)"; rc=1; }
          done
          if [ "$rc" = "0" ] && [ "$TIMEOUT" = "-1" ]; then
            echo "Done: primary compute will NO LONGER scale to zero (autosuspend disabled)."
          elif [ "$rc" = "0" ]; then
            echo "Done: primary compute suspend_timeout_seconds set to $TIMEOUT."
          fi
          exit $rc

      - name: Verify prod is healthy
        if: ${{ always() }}
        run: |
          base="https://api.tapeline.io"
          for i in $(seq 1 6); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$base/api/health?cb=${GITHUB_RUN_ID}-$i" || echo 000)
            [ "$code" = "200" ] && { echo "api healthy ($code)"; exit 0; }
            echo "attempt $i: $code"; sleep 5
          done
          echo "::warning title=Health check::api.tapeline.io not 200 yet (this config change does not restart the DB)."
