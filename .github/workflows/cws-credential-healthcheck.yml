# Proves the Chrome Web Store publishing credentials still work, without
# uploading or publishing anything.
#
# Worth having on a schedule rather than only on demand. A refresh token dies
# quietly — revoked in the Google account's third-party access list, the OAuth
# client deleted for six months' inactivity, or the consent screen knocked back
# to "Testing", which caps refresh tokens at seven days. None of those announce
# themselves. Without this the first sign is a failed release, at the moment you
# least want to debug OAuth.
#
# Prints only pass/fail. The access token it mints is never echoed.

name: CWS credential healthcheck

on:
  workflow_dispatch:
  schedule:
    # Mondays 02:00 UTC — before the week's work, not during it.
    - cron: "0 2 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange the refresh token
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          node -e '
            const { CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN } = process.env;
            const missing = Object.entries({ CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN })
              .filter(([, v]) => !v).map(([k]) => k);
            if (missing.length) {
              console.error(`\n✖ Missing secret(s): ${missing.join(", ")}`);
              process.exit(1);
            }
            const res = await fetch("https://oauth2.googleapis.com/token", {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: new URLSearchParams({
                client_id: CWS_CLIENT_ID,
                client_secret: CWS_CLIENT_SECRET,
                refresh_token: CWS_REFRESH_TOKEN,
                grant_type: "refresh_token",
              }),
            });
            const body = await res.json().catch(() => ({}));
            if (res.ok && body.access_token) {
              // Length only — never the token itself.
              console.log(`✓ credentials valid (access token minted, ${body.access_token.length} chars, expires in ${body.expires_in}s)`);
              process.exit(0);
            }
            console.error(`\n✖ Exchange failed (HTTP ${res.status}): ${body.error || "unknown"}`);
            if (body.error === "invalid_grant") {
              console.error(
                "invalid_grant means the refresh token no longer works. Usual causes:\n" +
                "  - revoked at https://myaccount.google.com/permissions\n" +
                "  - the consent screen was moved back to \"Testing\" (7-day token lifetime)\n" +
                "  - it was issued for a different OAuth client than CWS_CLIENT_ID\n" +
                "Re-mint it: docs/CHROME_WEB_STORE_SETUP.md section 3."
              );
            }
            if (body.error_description) console.error(body.error_description);
            process.exit(1);
          '
