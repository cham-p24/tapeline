name: Set SESSION_SECRET (bootstrap / rotate)

# One-click operator tool to provision the production session-signing secret
# WITHOUT anyone installing or authenticating flyctl locally.
#
# WHY THIS EXISTS
#   services/session._session_secret() currently falls back to deriving the
#   session key from STRIPE_WEBHOOK_SECRET (and, if that's unset, a constant in
#   this public repo). The correct fix is a dedicated SESSION_SECRET Fly secret.
#   This workflow generates a strong random value IN CI (openssl rand -hex 32)
#   and sets it via the same FLY_API_TOKEN the deploy pipeline already uses, so
#   the value is never typed, pasted, logged, or seen by anyone.
#
# HOW TO RUN
#   Actions tab -> "Set SESSION_SECRET (bootstrap / rotate)" -> Run workflow ->
#   type the confirm phrase. Or:
#     gh workflow run set-session-secret.yml -f confirm=set-session-secret
#
# MODES
#   bootstrap (default) - set SESSION_SECRET only if it is not already set.
#                         Safe to re-run: a no-op once set, so it can't sign
#                         users out by accident.
#   rotate              - overwrite with a fresh value. Signs EVERY user out
#                         once (all existing cookies stop verifying). Use only
#                         deliberately.
#
# Setting/rotating the secret restarts the app (Fly applies secret changes with
# a rolling restart of the current release) — no rebuild, no migration re-run
# beyond the idempotent alembic release command.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type exactly: set-session-secret'
        required: true
        default: ""
      mode:
        description: "bootstrap = set only if unset; rotate = overwrite (signs everyone out)"
        required: true
        default: bootstrap
        type: choice
        options:
          - bootstrap
          - rotate

concurrency:
  group: session-secret
  cancel-in-progress: false

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: Gate on the confirm phrase
        if: ${{ inputs.confirm != 'set-session-secret' }}
        run: |
          echo "::error title=Not confirmed::Type 'set-session-secret' in the confirm box to run."
          exit 1

      # Pinned to the same immutable SHA as deploy-backend.yml. This job holds
      # the production FLY_API_TOKEN, so never loosen this to a branch/tag.
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: Set SESSION_SECRET
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error title=No token::FLY_API_TOKEN secret is not set."
            exit 1
          fi
          already_set=false
          if flyctl secrets list -a tapeline-backend | grep -qw SESSION_SECRET; then
            already_set=true
          fi
          if [ "$already_set" = "true" ] && [ "$MODE" != "rotate" ]; then
            echo "SESSION_SECRET is already set — bootstrap is a no-op."
            echo "Re-run with mode=rotate to overwrite (that WILL sign everyone out)."
            exit 0
          fi
          # Generate the value here; it is never printed. flyctl reads it from
          # the argument and stores it write-only.
          value="$(openssl rand -hex 32)"
          flyctl secrets set "SESSION_SECRET=${value}" -a tapeline-backend >/dev/null
          if [ "$already_set" = "true" ]; then
            echo "SESSION_SECRET ROTATED. All existing sessions are now invalid."
          else
            echo "SESSION_SECRET bootstrapped. It was previously unset (session keys"
            echo "were deriving from STRIPE_WEBHOOK_SECRET). Existing sessions are now"
            echo "invalid — users sign in again once."
          fi

      - name: Verify prod comes back healthy
        run: |
          base="https://api.tapeline.io"
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$base/api/health?cb=${GITHUB_RUN_ID}-$i" || echo 000)
            [ "$code" = "200" ] && { echo "healthy after restart"; exit 0; }
            echo "attempt $i: $code — waiting for the secret-change restart"; sleep 10
          done
          echo "::error title=Unhealthy::api.tapeline.io did not return 200 after the secret change"
          exit 1
