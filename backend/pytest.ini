[pytest]
asyncio_mode = auto
testpaths = tests
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
    # An exception in a thread the test did not join (e.g. aiosqlite's worker
    # after its event loop closed) is a real leak, not noise: fail the test.
    error::pytest.PytestUnhandledThreadExceptionWarning
