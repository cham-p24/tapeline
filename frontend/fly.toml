# Tapeline frontend on Fly.io — Vercel-independent host.
# Sydney region to match the backend (tapeline-backend) and the Melbourne
# founder. Public Next.js standalone server on :3000.
app = "tapeline-web"
primary_region = "syd"

[build]
  # NEXT_PUBLIC_* is inlined at BUILD time — a Fly *secret* by the same name is a
  # runtime var and reaches the client bundle too late to do anything. Anything
  # that gates a client feature belongs here, not in `fly secrets set`.
  # These two keys are public by design (every browser receives them); the paired
  # server-side secrets (CLOUDFLARE_TURNSTILE_SECRET_KEY) stay in Fly secrets.
  [build.args]
    # Cloudflare Turnstile site key. Empty = the signup widget never renders and
    # bot protection is off. Paste the site key from the Cloudflare dashboard
    # (Turnstile > your widget) to switch it on.
    NEXT_PUBLIC_TURNSTILE_SITE_KEY = ""
    # PostHog project key (starts `phc_`) + region host. Empty = PostHog no-ops.
    # Host is https://us.i.posthog.com or https://eu.i.posthog.com — must match
    # the region chosen at project creation; it cannot be changed afterwards.
    NEXT_PUBLIC_POSTHOG_KEY = ""
    NEXT_PUBLIC_POSTHOG_HOST = ""

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # HA: keep TWO machines running at all times. With a single machine, any
  # restart (deploy), suspend, crash, or Fly host maintenance left tapeline.io
  # briefly unreachable — the intermittent HTTP 0 blips the uptime watchdog
  # kept paging on. Two always-on machines let Fly's proxy serve from one while
  # the other restarts (zero-downtime rolling deploys) and survive a single
  # machine/host failure. The deploy workflow runs `flyctl scale count 2` so the
  # machines actually exist for this floor to hold.
  min_machines_running = 2
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  interval = "15s"
  timeout = "4s"
  grace_period = "30s"
  method = "GET"
  path = "/how-it-works"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
